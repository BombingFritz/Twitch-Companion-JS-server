<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twitch Companion Admin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Twitch Companion Admin</h1>
      <span class="version" id="version"></span>
    </div>
    <div class="connection" id="connection" role="status">
      <span class="dot" aria-hidden="true"></span>
      <span id="connection-text">verbinde …</span>
    </div>
  </header>

  <div class="notice" id="notice" role="status" hidden></div>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Bereiche"></nav>

  <main id="content" role="tabpanel" tabindex="-1"></main>

  <script src="admin.js"></script>
</body>
</html>
